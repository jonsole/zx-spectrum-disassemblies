<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${csp}; script-src 'nonce-${nonce}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="${style}">
<title>The Hobbit</title>
</head>
<body>
<header>
  <span id="score" title="The score, which cannot go past 75%: see the Bugs page">Score -</span>
  <span id="here"></span>
  <span id="status"></span>
</header>
<main>
  <section id="log-pane">
    <h2>What happens
      <label title="Lines the game only tried out, to see whether an action would work"><input id="show-considered" type="checkbox" checked> Considered</label>
      <button id="clear-log" title="Clear the log">Clear</button></h2>
    <div id="log-status"></div>
    <div id="log"></div>
  </section>
  <div id="split-x" class="splitter vertical" title="Drag to resize; double-click to reset"></div>
  <section id="objects-pane">
    <h2>Objects
      <input id="filter" type="search" placeholder="Filter by name or place">
      <label><input id="here-only" type="checkbox"> Where you are</label>
    </h2>
    <div class="scroll">
      <table id="objects">
        <thead>
          <tr>
            <th title="Object number">Nr</th>
            <th>Name</th>
            <th>Where</th>
            <th title="How many places it is in at once">#</th>
            <th title="Size (volume)">Size</th>
            <th title="Weight (mass)">Wt</th>
            <th title="Byte 4: placement and sides">4</th>
            <th title="Strength">Str</th>
            <th title="Defence">Def</th>
            <th id="flags-head">Flags</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <div id="split-y" class="splitter horizontal" title="Drag to resize; double-click to reset"></div>
  <section id="map-pane">
    <h2>Map
      <span id="centred"></span>
      <button id="follow" hidden title="Centre the map on the player again, and follow them">Follow you</button>
      <label>Zoom <input id="zoom" type="range" min="40" max="160" value="100"></label>
      <span class="legend"><span class="swatch you"></span> you <span class="swatch dark"></span> dark
        <span class="swatch unvisited"></span> not yet visited</span>
    </h2>
    <div class="scroll" id="map-scroll"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </section>
</main>
<script nonce="${nonce}" src="${flow}"></script>
<script nonce="${nonce}" src="${script}"></script>
</body>
</html>
